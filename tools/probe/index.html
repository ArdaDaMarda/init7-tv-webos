<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TV7 Probe</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; background: #000; color: #eee; font: 24px/1.35 sans-serif; overflow: hidden; }
  video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; }
  #panel { position: absolute; left: 40px; top: 40px; width: 900px; max-height: 1000px; padding: 20px 24px; background: rgba(0,0,0,.75); border-radius: 12px; }
  #keys { color: #9cf; margin-bottom: 12px; white-space: pre; }
  #log { white-space: pre-wrap; font-family: monospace; font-size: 20px; }
  .ok { color: #7f7; } .bad { color: #f77; } .info { color: #ccc; }
</style>
</head>
<body>
<video id="video" autoplay></video>
<div id="panel">
  <div id="keys"></div>
  <div id="log"></div>
</div>
<script src="probe.js"></script>
</body>
</html>
