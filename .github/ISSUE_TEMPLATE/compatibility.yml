name: Compatibility report
description: Tell us whether the app works on your TV
labels: [compatibility]
body:
  - type: input
    id: tv
    attributes:
      label: TV model and webOS version
      description: Settings → General → About This TV
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works?
      options:
        - label: HLS channels play (e.g. 1 SRF 1, 9 ProSieben)
        - label: Multicast channels play (e.g. 26 ZDFneo, 58 Phoenix)
        - label: Programme guide opens and shows programmes
        - label: Picture-in-picture shows live video in the guide
        - label: Audio language switching (▶ → Audio)
        - label: Remote buttons GUIDE / 123 / wheel work
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Switching times, problems, remote model, anything else
